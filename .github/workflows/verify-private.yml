name: Verify private AsTeR source
# Recheck search provider graceful fallback, greeting routing, and TypeScript build
on:
  push:
    paths:
      - .github/workflows/verify-private.yml
  workflow_dispatch:
  # Recheck required service account fields, legacy migration and responsive signup
permissions:
  contents: read
jobs:
  verify-private:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out private AsTeR application
        uses: actions/checkout@v4
        with:
          repository: mok9900/aster-ai
          ref: feat/aster-native-search-20261023
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Verify private tests and production build
        run: |
          npm ci
          npm test
          npm run build
