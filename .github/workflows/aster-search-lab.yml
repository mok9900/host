name: AsTeR Search Lab
run-name: AsTeR Search Lab · ${{ inputs.operation || 'validate' }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Start a temporary search test server, or stop it
        type: choice
        required: true
        default: start
        options: [start, stop]
  push:
    paths:
      - .github/workflows/aster-search-lab.yml

permissions:
  contents: write
  actions: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out private search engine
        uses: actions/checkout@v4
        with:
          repository: mok9900/aster-ai
          ref: feat/aster-native-search-20261023
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
          path: app
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests for search engine
        run: |
          cd app/search-engine
          npm test
      - name: Validate Compose configuration
        run: |
          cd app/search-engine
          ASTER_TOOL_TOKEN=unit-test-placeholder ASTER_SEARXNG_SECRET=unit-test-placeholder docker compose config --quiet
      - name: Container startup and authentication smoke test
        shell: bash
        run: |
          set -euo pipefail
          cd app/search-engine
          umask 077
          printf 'ASTER_TOOL_TOKEN=%s\n' "$(openssl rand -hex 32)" > .env
          printf 'ASTER_SEARXNG_SECRET=%s\n' "$(openssl rand -hex 32)" >> .env
          trap 'docker compose --env-file .env down --remove-orphans >/dev/null 2>&1 || true; rm -f .env' EXIT
          docker compose --env-file .env up --detach --build --wait --wait-timeout 120
          # The image-level "healthy" state may precede Granian's ready socket.
          # Check from the gateway container's network, not just its /healthz.
          ready=0
          for attempt in $(seq 1 40); do
            if docker compose exec -T search node -e \
              'fetch("http://searxng:8080/", {signal:AbortSignal.timeout(1500)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'; then
              ready=1; break
            fi
            sleep 2
          done
          if [[ "$ready" != "1" ]]; then
            echo "::error::SearXNG worker did not become ready."
            docker compose --env-file .env logs --no-color --tail 40 searxng
            exit 1
          fi
          curl --fail --silent --show-error --retry 8 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:8787/healthz > /dev/null
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 \
            -X POST http://127.0.0.1:8787/v1/search \
            -H 'Content-Type: application/json' --data '{"query":"test"}')
          [[ "$code" == "401" ]] || { echo "::error::Unauthenticated API must return 401, got $code"; exit 1; }
          echo "Dockerized search gateway is listening, health check OK, bearer authentication enforced."
          # External search engines can independently limit requests; report
          # the first real query but do not obscure upstream failures.
          export ASTER_TOOL_TOKEN="$(sed -n 's/^ASTER_TOOL_TOKEN=//p' .env)"
          response="$(curl --silent --show-error --max-time 18 \
            -X POST http://127.0.0.1:8787/v1/search \
            -H "Authorization: Bearer $ASTER_TOOL_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"query":"Riemann hypothesis","limit":3}' \
            --write-out '\n%{http_code}' || true)"
          status="$(printf '%s\n' "$response" | tail -n 1)"
          if [[ "$status" == "200" ]]; then
            echo "Real SearXNG search: success (HTTP 200)"
          else
            echo "::warning::External metasearch upstream returned HTTP $status. Diagnosing direct backend."
            docker compose exec -T search node --input-type=module - <<'NODE'
              const url = "http://searxng:8080/search?q=Riemann%20hypothesis&format=json";
              try {
                const r = await fetch(url, { signal: AbortSignal.timeout(12000) });
                const body = await r.text();
                let results = null;
                try { const data = JSON.parse(body); results = { results: data.results?.length, engines: data.unresponsive_engines?.length }; } catch {}
                console.log("Direct SearXNG:", { status:r.status, type:r.headers.get("content-type"), ...results });
              } catch (e) {
                console.log("Direct SearXNG failed:",e?.cause?.code || e?.name || "fetch-error");
              }
          NODE
            docker compose --env-file .env ps
            docker compose --env-file .env logs --no-color --tail 35 searxng
          fi

  serve:
    # Manually started test session: one click, automatic main-app discovery.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'start' }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    concurrency:
      group: aster-search-lab-server
      cancel-in-progress: true
    steps:
      - name: Check out public orchestration tools
        uses: actions/checkout@v4
        with:
          path: infra
          persist-credentials: false
      - name: Check out private search engine
        uses: actions/checkout@v4
        with:
          repository: mok9900/aster-ai
          ref: feat/aster-native-search-20261023
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
          path: app
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Derive gateway key from existing private checkout secret
        env:
          SOURCE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: node infra/scripts/search-lab-identity.mjs
      - name: Start isolated search gateway and SearXNG
        shell: bash
        run: |
          set -euo pipefail
          cd app/search-engine
          umask 077
          printf 'ASTER_TOOL_TOKEN=%s\n' "$ASTER_TOOL_TOKEN" > .env
          printf 'ASTER_SEARXNG_SECRET=%s\n' "$(openssl rand -hex 32)" >> .env
          docker compose --env-file .env up --build --detach --wait --wait-timeout 120
          # Docker health alone may precede the actual SearXNG listening socket.
          ready=0
          for attempt in $(seq 1 40); do
            if docker compose exec -T search node -e \
              'fetch("http://searxng:8080/", {signal:AbortSignal.timeout(1800)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'; then
              ready=1; break
            fi
            sleep 2
          done
          [[ "$ready" == "1" ]] || { echo "::error::Search worker did not become ready."; exit 1; }
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8787/healthz >/dev/null
      - name: Download and verify pinned tunnel connector
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            https://github.com/cloudflare/cloudflared/releases/download/2026.10.2/cloudflared-linux-amd64 \
            --output "$RUNNER_TEMP/cloudflared"
          echo '35fbdd2beb378436c7da377d7358cea8e33f9c94a6705d1d8036bf9b0d6d8005  '"$RUNNER_TEMP/cloudflared" | sha256sum --check --status
          chmod 755 "$RUNNER_TEMP/cloudflared"
      - name: Publish short-lived HTTPS tunnel and serve until manually stopped
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tunnel_log="$RUNNER_TEMP/aster-search-tunnel.log"
          # Quick Tunnels are intended for development and need no manual
          # Cloudflare token. A new HTTPS address is assigned each session.
          "$RUNNER_TEMP/cloudflared" tunnel --no-autoupdate --url http://127.0.0.1:8787 > "$tunnel_log" 2>&1 &
          tunnel_pid=$!
          registered=0
          cleanup() {
            trap - EXIT INT TERM
            if [[ "$registered" == "1" ]]; then
              node infra/scripts/search-lab-registry.mjs offline "" || true
            fi
            kill "$tunnel_pid" 2>/dev/null || true
            (cd app/search-engine && docker compose --env-file .env down --remove-orphans >/dev/null 2>&1) || true
            rm -f app/search-engine/.env
          }
          trap cleanup EXIT INT TERM
          endpoint=""
          for attempt in $(seq 1 70); do
            if ! kill -0 "$tunnel_pid" 2>/dev/null; then
              echo "::error::The temporary HTTPS tunnel process terminated."
              exit 1
            fi
            endpoint="$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$tunnel_log" | head -n 1 || true)"
            if [[ -n "$endpoint" ]]; then
              status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 "$endpoint/healthz" || true)"
              if [[ "$status" == "200" ]]; then break; fi
            fi
            sleep 2
          done
          if [[ -z "$endpoint" || "$status" != "200" ]]; then
            echo "::error::Cloudflare Quick Tunnel did not become ready."
            exit 1
          fi
          # Never publish a credential; the public registry contains only a
          # signed expiring endpoint. Main AsTeR validates the signature.
          node infra/scripts/search-lab-registry.mjs online "$endpoint"
          registered=1
          echo "AsTeR Search Lab online. Main AsTeR discovers it automatically."
          echo "Endpoint available via signed service registry (no token exposed)."
          while kill -0 "$tunnel_pid" 2>/dev/null; do
            if ! curl --fail --silent --max-time 3 http://127.0.0.1:8787/healthz >/dev/null; then
              echo "::error::Search gateway became unhealthy."
              exit 1
            fi
            sleep 15
          done
          echo "::error::Search tunnel connector terminated."
          exit 1

  stop:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'stop' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out registry management tools
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Derive same authenticated gateway identity
        env:
          SOURCE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: node scripts/search-lab-identity.mjs
      - name: Stop any running search test sessions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/search-lab-registry.mjs offline-current || true
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/aster-search-lab.yml/runs?status=in_progress&per_page=100" \
            --jq '.workflow_runs[].id' | while read -r run_id; do
              [[ -z "$run_id" || "$run_id" == "$GITHUB_RUN_ID" ]] && continue
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null || true
              echo "Cancellation requested for search lab run $run_id"
            done
          echo "Search lab stop requested; it will not automatically restart."
